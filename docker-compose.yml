# Local development dependencies only. Nothing here is used in staging or production.
# The passwords below are local-only and have no value outside a developer machine.

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ghurify-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Ghurify_Local_Dev_1"
      MSSQL_PID: "Developer"
      # Full-text search backs trip and destination search.
      MSSQL_ENABLE_FULLTEXT: "1"
    ports:
      - "1433:1433"
    volumes:
      - ghurify-sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: ghurify-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ghurify-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: ghurify-azurite
    # --skipApiVersionCheck: the Azure SDK speaks a newer storage API version than Azurite
    # releases list; without it every upload fails locally with "API version not supported".
    command:
      [
        "azurite",
        "--blobHost",
        "0.0.0.0",
        "--queueHost",
        "0.0.0.0",
        "--tableHost",
        "0.0.0.0",
        "--skipApiVersionCheck",
      ]
    ports:
      - "10000:10000" # blob
      - "10001:10001" # queue
      - "10002:10002" # table
    volumes:
      - ghurify-azurite-data:/data

volumes:
  ghurify-sqlserver-data:
  ghurify-redis-data:
  ghurify-azurite-data:
